# Docker Compose for azops-mcp
#
# Usage:
#   docker compose build                     # build the image
#   docker compose run --rm mcp-server       # run MCP server interactively (stdio)
#
# The MCP server uses stdio transport so it cannot be a long-running
# service — use "docker compose run" to spawn it on demand.

services:

  # --------------------------------------------------------------------------
  # MCP server  (stdio — run interactively, not as a daemon)
  # --------------------------------------------------------------------------
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azops-mcp-server
    stdin_open: true    # required for stdio transport
    tty: true           # required for stdio transport
    env_file:
      # Loads AZURE_SUBSCRIPTION_ID, AZURE_TENANT_ID, etc.
      - path: .env
        required: false
    profiles:
      # Not started by default with `docker compose up`.
      # Use `docker compose run --rm mcp-server` instead.
      - cli
